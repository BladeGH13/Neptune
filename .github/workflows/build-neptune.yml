name: Build Neptune Browser (Windows)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build for Windows 10/11
    runs-on: windows-2022

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout Neptune
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Set up Python ───────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. Add NSIS to PATH ────────────────────────────────────────────────
      - name: Add NSIS to PATH
        shell: powershell
        run: |
          $nsisPath = "C:\Program Files (x86)\NSIS"
          if (Test-Path $nsisPath) {
            echo $nsisPath | Out-File -Append -Encoding ascii $env:GITHUB_PATH
          }

      # ── 4. Install Mozilla Build ───────────────────────────────────────────
      - name: Install Mozilla Build
        shell: powershell
        run: |
          $url = "https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe"
          $out = "$env:TEMP\MozillaBuildSetup.exe"
          Invoke-WebRequest -Uri $url -OutFile $out
          Start-Process -FilePath $out -ArgumentList "/S" -Wait
          echo "Install complete. Exit code: $LASTEXITCODE"

      # ── 5. DIAGNOSTIC: Find Mozilla Build and bash ────────────────────────
      - name: Find Mozilla Build installation
        shell: powershell
        run: |
          echo "=== Searching all drives for mozilla-build ==="
          $drives = @("C:\", "D:\")
          foreach ($drive in $drives) {
            Get-ChildItem -Path $drive -Filter "mozilla-build" -Recurse -ErrorAction SilentlyContinue -Depth 3 |
              ForEach-Object { echo $_.FullName }
          }

          echo ""
          echo "=== Searching for bash.exe anywhere ==="
          foreach ($drive in $drives) {
            Get-ChildItem -Path $drive -Filter "bash.exe" -Recurse -ErrorAction SilentlyContinue -Depth 6 |
              ForEach-Object { echo $_.FullName }
          }

          echo ""
          echo "=== Searching for mach file ==="
          Get-ChildItem -Path "D:\a" -Filter "mach" -Recurse -ErrorAction SilentlyContinue -Depth 5 |
            ForEach-Object { echo $_.FullName }

          echo ""
          echo "=== Contents of C:\ ==="
          Get-ChildItem "C:\" -ErrorAction SilentlyContinue | Select-Object Name

          echo ""
          echo "=== Contents of D:\ ==="
          Get-ChildItem "D:\" -ErrorAction SilentlyContinue | Select-Object Name

          echo ""
          echo "=== PATH ==="
          $env:PATH -split ";" | ForEach-Object { echo $_ }
